<div menu-data-rev-modal class="modal-content is-hidden">
  <div class="reviewmodal">
    <svg class="reviewmodal-svg" menu-data-modal-rev-close>
      <use href="src/img/icons/symbol-defs.svg#icon-exit"></use>
    </svg>
    <h2 class="reviewmodal-title">
      LEAVE A REVIEW ABOUT
      <span class="reviewmodal-span">OUR CHOCOLATE</span>
    </h2>

    <form class="reviewmodal-form">
      <input class="reviewmodal-input" placeholder="Name" type="text" />
      <input class="reviewmodal-input" placeholder="Surname" type="text" />
      <div class="reviewmodal-from-wrap">
        <input
          class="reviewmodal-number"
          placeholder="Phone number"
          type="text"
        />
        <div class="reviewmodal-from-wrap-wrap">
          <svg class="reviewmodal-wrap-svg-uk">
            <use href="src/img/icons/symbol-defs.svg#icon-flag"></use>
          </svg>
          <label class="reviewmodal-wrap-add">380+</label>
        </div>
      </div>
      <textarea
        rows="4"
        class="reviewmodal-area"
        placeholder="Enter text"
      ></textarea>
      <button
        menu-data-modal-revthx-open
        menu-data-modal-rev-close-btn
        class="reviewmodal-btn"
        type="button"
      >
        Send
      </button>
    </form>
  </div>
</div>
